name: Derle

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Supabase bilgileri depo sırlarından gelir (Settings > Secrets and variables > Actions):
#   SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY
# Tanımlı değilse uygulama yalnızca yerel modda derlenir.

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter analyze
      - run: flutter test

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: env.json oluştur
        shell: bash
        run: |
          printf '{"SUPABASE_URL":"%s","SUPABASE_PUBLISHABLE_KEY":"%s"}' \
            "${{ secrets.SUPABASE_URL }}" "${{ secrets.SUPABASE_PUBLISHABLE_KEY }}" > env.json
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter build windows --release --dart-define-from-file=env.json
      - name: MSIX kurulum paketi
        run: dart run msix:create --build-windows false --install-certificate false
      - uses: actions/upload-artifact@v4
        with:
          name: zamanla-windows
          path: |
            build/windows/x64/runner/Release/
      - uses: actions/upload-artifact@v4
        with:
          name: zamanla-windows-msix
          path: build/windows/x64/runner/Release/*.msix

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: env.json oluştur
        run: |
          printf '{"SUPABASE_URL":"%s","SUPABASE_PUBLISHABLE_KEY":"%s"}' \
            "${{ secrets.SUPABASE_URL }}" "${{ secrets.SUPABASE_PUBLISHABLE_KEY }}" > env.json
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter build apk --release --dart-define-from-file=env.json
      - uses: actions/upload-artifact@v4
        with:
          name: zamanla-android
          path: build/app/outputs/flutter-apk/app-release.apk
